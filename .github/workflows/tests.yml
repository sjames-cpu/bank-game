name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Pinned engine: keep in step with the version used locally (CLAUDE.md).
      # The standard (non-.NET) build: the project enables .NET in
      # project.godot but has no C# scripts yet.
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      # For run_tests.sh's generated-art check (tools/art/generate_characters.py,
      # standard library only). Keep Python 3.12: the check compares PNG bytes,
      # and different zlib versions can compress the same image to different
      # bytes, which once failed the art check on CI.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          chmod +x ~/godot/godot

      - name: Run art check, tests and headless boots
        run: GODOT_BIN=~/godot/godot PYTHON_BIN=python ./run_tests.sh

      # After a failure, turn the gdUnit4 results into annotations: up to 10
      # failing tests with their messages, and one notice with the OS, Godot
      # version and counts. Annotations are readable without a GitHub login;
      # the job logs are not. Skipped, and silent, when everything passes.
      - name: Diagnose test failures
        if: failure()
        run: |
          python - <<'PY'
          import glob, os, re, subprocess, xml.etree.ElementTree as ET
          def esc(t, prop=False):
              t = t.replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              return t.replace(':', '%3A').replace(',', '%2C') if prop else t
          godot = subprocess.run([os.path.expanduser('~/godot/godot'), '--version'], capture_output=True, text=True).stdout.strip()
          reports = sorted(glob.glob('reports/report_*/results.xml'), key=lambda f: int(re.search(r'report_(\d+)', f).group(1)))
          run = failed = 0
          found = []
          if reports:
              root = ET.parse(reports[-1]).getroot()
              for case in root.iter('testcase'):
                  run += 1
                  for bad in list(case.findall('failure')) + list(case.findall('error')):
                      failed += 1
                      text = (bad.get('message') or '') + ' ' + (bad.text or '')
                      found.append((case.get('classname', '') + '.' + case.get('name', ''), ' '.join(text.split())))
          for name, text in found[:10]:
              print('::error title=%s::%s' % (esc(name, True), esc(text[:400])))
          print('::notice::OS=%s | Godot=%s | tests run=%d | failed=%d | report=%s | failed step: Run art check, tests and headless boots' % (os.uname().sysname, godot, run, failed, reports[-1] if reports else 'none found'))
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gdunit4-report
          path: reports/
          if-no-files-found: ignore
